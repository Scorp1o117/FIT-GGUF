[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-gguf"
version = "0.3.1"
description = "Fit-to-Size Intelligent Tensor Quantization for GGUF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
fit = "fit_gguf.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    # test_clean_wheel_registry_verify builds a wheel with
    # --no-build-isolation, so the build frontend (pip) and the build backend
    # (setuptools) must both be importable from the test environment rather than
    # a per-build isolated one. A stdlib `python -m venv` ships pip; `uv venv`
    # does not, so declaring it keeps every documented setup path equivalent.
    "setuptools>=61.0",
    "pip>=23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", "test-Models", ".git"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

[tool.setuptools.package-data]
fit_gguf = ["registry/**/*.json", "profiles/guard/*.yaml", "contracts/*.json"]
