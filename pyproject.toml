[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-gguf"
version = "0.1.0"
description = "Fit-to-Size Intelligent Tensor Quantization for GGUF"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", "test-Models", ".git"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
