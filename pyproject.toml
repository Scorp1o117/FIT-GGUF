[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fit-gguf"
version = "0.1.0"
description = "Fit-to-Size Intelligent Tensor Quantization for GGUF"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
fit = "fit_gguf.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party", "test-Models", ".git"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
